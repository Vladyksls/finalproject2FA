{% extends "base.html" %}

{% block content %}
<div class="checkout-wrapper">
    <h1 class="checkout-title">Вход</h1>

    {% if error %}
        <p style="color:red; text-align:center;">{{ error }}</p>
    {% endif %}

<form method="post" class="payment-form">
    <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
    </div>

    <div class="form-group">
        <label>Пароль</label>
        <input type="password" name="password" required>
    </div>

    <button class="checkout-btn" type="submit">Войти</button>
</form>

<p class="auth-switch">
    Нет аккаунта?
    <a href="{{ url_for('register') }}">Создать</a>
</p>
</div>
{% endblock %}
